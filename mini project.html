<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Koleksi Buku Perpustakaan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #000;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 0px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .btn-submit,
        .form-group select {
            width: 250px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .btn-submit {
            margin-left: 150px;
            padding: 6px 12px;
            background-color: #f0f0f0;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #e0e0e0;
        }

        ul {
            padding-left: 20px;
            line-height: 1.6;
        }

        span.required {
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Daftar Koleksi Buku Perpustakaan</h1>

    <h2>Koleksi Buku Saat Ini</h2>
    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Judul Buku</th>
                <th>Penulis</th>
                <th>Tahun Terbit</th>
                <th>Jumlah Halaman</th>
                <th>Genre</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.</td>
                <td>Filosofi Teras</td>
                <td>Henry Manampiring</td>
                <td>2018</td>
                <td>346</td>
                <td>Filosofi</td>
            </tr>
            <tr>
                <td>2.</td>
                <td>Atomic Habits</td>
                <td>James Clear</td>
                <td>2018</td>
                <td>320</td>
                <td>Pengembangan Diri</td>
            </tr>
            <tr>
                <td>3.</td>
                <td>Kitab Kawin</td>
                <td>Laila Akhmad</td>
                <td>2018</td>
                <td>207</td>
                <td>Horor</td>
            </tr>
        </tbody>
    </table>
    <h2>Tambah Buku Baru</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="judul">Judul Buku:</label>
            <input type="text" id="judul" name="judul" placeholder="Masukkan judul buku" required maxlength="100">
        </div>
        <div class="form-group">
            <label for="penulis">Penulis:</label>
            <input type="text" id="penulis" name="penulis" placeholder="Masukkan nama penulis" required maxlength="70">
        </div>
        <div class="form-group">
            <label for="tahun">Tahun Terbit:</label>
            <input type="number" id="tahun" name="tahun" placeholder="eg 2023" required min="1000" max="2025">
        </div>
        <div class="form-group">
            <label for="halaman">Jumlah Halaman:</label>
            <input type="number" id="halaman" name="halaman" placeholder="eg 300" required min="1">
        </div>

        <div class="form-group">
            <label for="genre">Genre:</label>
            <select id="genre" name="genre" required>
                <option value="" disabled selected>Pilih Genre</option>
                <option value="Filosofi">Filosofi</option>
                <option value="Pengembangan Diri">Pengembangan Diri</option>
                <option value="Horor">Horor</option>
            </select>
        </div>


</body>

</html>
