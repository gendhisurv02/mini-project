<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Koleksi Buku Perpustakaan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: azure;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
        }

        .btn-submit,
        .form-group select {
            width: 250px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .btn-submit {
            margin-left: 150px;
            padding: 6px 12px;
            background-color: #f0f0f0;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #e0e0e0;
        }

        ul {
            padding-left: 20px;
            line-height: 1.6;
        }

        span.required {
            font-style: italic;
        }
    </style>
</head>

<body>

</body>

</html>
